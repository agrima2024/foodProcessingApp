<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Scanner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Food Scanner</h1>
        </header>
        
        <main>
            <div id="scanner-section">
                <div id="loading-message">
                    <p>Starting camera...</p>
                </div>
                <div id="scanner-container" class="hidden"></div>
                <p class="instruction-text">Point camera at a barcode</p>
            </div>

            <div id="results-section" class="hidden">
                <div id="score-display">?</div>
                <h2 id="product-name">Product Name</h2>
                
                <div class="info-card">
                    <h3>Ingredients</h3>
                    <p id="ingredients-text">Loading...</p>
                </div>

                <div id="alternatives-section" class="hidden">
                    <h3>Healthier Alternatives</h3>
                    <div id="alternatives-container">
                        </div>
                </div>

                <button id="scan-again-btn">Scan Next Item</button>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    
    <script src="js/main.js"></script>
</body>
</html>
